{% extends "base.html" %}

{% block title %}Edit Customer | KleanFlow{% endblock %}
{% block page_title %}Edit Customer Record{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h5 class="fw-bold mb-1">Edit Customer Details</h5>
                        <p class="text-muted small mb-0">Updating record for <strong>{{ customer.full_name }}</strong> ({{ customer.customer_code }})</p>
                    </div>
                    <a href="{{ url_for('customers.show', customer_id=customer.id) }}" class="btn btn-light btn-sm border rounded-3">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Profile
                    </a>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('customers.edit', customer_id=customer.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="customer_code" class="form-label small fw-semibold text-muted">Customer Code</label>
                            <input type="text" class="form-control bg-light font-monospace" id="customer_code" value="{{ customer.customer_code }}" readonly>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="full_name" class="form-label small fw-semibold text-muted">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ (data.full_name if data else customer.full_name) }}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="phone_number" class="form-label small fw-semibold text-muted">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ (data.phone_number if data else customer.phone_number) }}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label small fw-semibold text-muted">Email Address (Optional)</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ (data.email if data else customer.email or '') }}">
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label small fw-semibold text-muted">Physical Address / Pickup Location <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="address" name="address" rows="3" required>{{ (data.address if data else customer.address or '') }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{{ url_for('customers.show', customer_id=customer.id) }}" class="btn btn-light border rounded-3 px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-3 px-4 fw-semibold">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
