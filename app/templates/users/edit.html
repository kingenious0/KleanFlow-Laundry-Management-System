{% extends "base.html" %}

{% block title %}Edit User | KleanFlow{% endblock %}
{% block page_title %}Edit User Account{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h5 class="fw-bold mb-1">Edit User Account</h5>
                        <p class="text-muted small mb-0">Updating details for <strong>{{ user.full_name }}</strong></p>
                    </div>
                    <a href="{{ url_for('users.index') }}" class="btn btn-light btn-sm border rounded-3">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Users
                    </a>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('users.edit', user_id=user.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="full_name" class="form-label small fw-semibold text-muted">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ (data.full_name if data else user.full_name) }}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label small fw-semibold text-muted">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ (data.email if data else user.email) }}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="phone_number" class="form-label small fw-semibold text-muted">Phone Number</label>
                            <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ (data.phone_number if data else user.phone_number or '') }}">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="role" class="form-label small fw-semibold text-muted">User Role <span class="text-danger">*</span></label>
                            <select class="form-select" id="role" name="role" required>
                                {% for r in roles %}
                                    <option value="{{ r }}" {% if (data.role if data else user.role) == r %}selected{% endif %}>{{ r }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="status" class="form-label small fw-semibold text-muted">Account Status <span class="text-danger">*</span></label>
                            <select class="form-select" id="status" name="status" required>
                                {% for st in statuses %}
                                    <option value="{{ st }}" {% if (data.status if data else user.status) == st %}selected{% endif %}>{{ st }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="password" class="form-label small fw-semibold text-muted">Reset Password (Optional)</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Leave blank to keep unchanged">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{{ url_for('users.index') }}" class="btn btn-light border rounded-3 px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-3 px-4 fw-semibold">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
