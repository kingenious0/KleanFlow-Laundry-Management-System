{% extends "base.html" %}

{% block title %}404 - Page Not Found | KleanFlow{% endblock %}
{% block page_title %}404 Not Found{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm rounded-4 p-5 text-center my-5">
    <div class="display-1 text-primary fw-bold mb-3"><i class="fa-solid fa-ghost"></i> 404</div>
    <h3 class="fw-bold mb-2">Page Not Found</h3>
    <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
    <div>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2 rounded-3">
            <i class="fa-solid fa-house me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
