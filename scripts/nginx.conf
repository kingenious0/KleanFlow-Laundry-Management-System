# ==============================================================================
# KleanFlow Laundry Management System
# Nginx Reverse Proxy Configuration
# ==============================================================================
# Place this file at: /etc/nginx/sites-available/kleanflow
# Then enable with:
#   sudo ln -s /etc/nginx/sites-available/kleanflow /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================================================

# Rate limiting zone (limits login attempts to 5 requests/min per IP)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream Gunicorn server
upstream kleanflow_app {
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP → HTTPS (uncomment after installing SSL certificate)
    # return 301 https://$host$request_uri;

    # ── Static Files ──────────────────────────────────────────────────────────
    location /static/ {
        alias /path/to/kleanflow/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        gzip_static on;
    }

    # ── Rate-Limited Login Endpoint ───────────────────────────────────────────
    location /auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://kleanflow_app;
        include /etc/nginx/proxy_params;
    }

    # ── Main Application Proxy ─────────────────────────────────────────────────
    location / {
        proxy_pass http://kleanflow_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout   60s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;

        # Buffer settings
        proxy_buffering         on;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";

    # ── File Upload Limit ─────────────────────────────────────────────────────
    client_max_body_size 20M;

    # ── Access & Error Logging ────────────────────────────────────────────────
    access_log /var/log/nginx/kleanflow.access.log;
    error_log  /var/log/nginx/kleanflow.error.log;
}

